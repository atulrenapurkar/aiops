# ── Application ───────────────────────────────────────────────
spring.application.name=aiops

# ── Secrets ───────────────────────────────────────────────────
# Never put real keys in this file — it is committed to Git.
# Every secret below is read as ${ENV_VAR:default}. Values come from, in order:
#   1. real environment variables
#   2. a local .env file in the working directory (git-ignored; copy .env.example)
#   3. the demo default after the ':'
spring.config.import=optional:file:.env[.properties]

# ── DataSource ────────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/aiops}
spring.datasource.username=${DB_USERNAME:aiops}
spring.datasource.password=${DB_PASSWORD:aiops123}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ───────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ── Flyway ────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ── Actuator ──────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics,mappings
management.endpoint.health.show-details=always

# ── File uploads (project documents: PDF, Word, email, chat exports) ─
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=100MB

# ── Ollama (embeddings always; chat only if llm.provider=ollama) ─
ollama.base-url=http://localhost:11434
ollama.embed-model=nomic-embed-text
ollama.chat-model=llama3

# ── LLM Provider Selection ────────────────────────────────────
# Which backend answers /api/suggest and /api/demo/*. One of:
#   anthropic  - Anthropic Messages API (default)
#   openai     - any OpenAI-compatible /chat/completions endpoint
#                (OpenAI, Azure OpenAI, Groq, Together, local vLLM/LM Studio, etc.)
#   ollama     - local Ollama chat model, no API key needed
# To switch providers: change llm.provider and the matching *.api-key /
# *.base-url / *.model below, then restart. No code changes needed.
llm.provider=anthropic

# ── Anthropic Claude ───────────────────────────────────────────
anthropic.base-url=https://api.anthropic.com/v1/messages
anthropic.api-key=${ANTHROPIC_API_KEY:}
anthropic.model=claude-sonnet-4-6
anthropic.max-tokens=2048

# ── OpenAI-compatible ──────────────────────────────────────────
openai.base-url=https://api.openai.com/v1/chat/completions
openai.api-key=${OPENAI_API_KEY:}
openai.model=gpt-4o
openai.max-tokens=2048

# ── Demo Mode ─────────────────────────────────────────────────
demo.enabled=true

# ── WireMock (stubs Confluence / Teams / Outlook in demo mode) ─
wiremock.port=8089

# ── Confluence → WireMock ─────────────────────────────────────
confluence.base-url=${CONFLUENCE_BASE_URL:http://localhost:8089}
confluence.username=${CONFLUENCE_USERNAME:demo}
confluence.api-token=${CONFLUENCE_API_TOKEN:demo}
confluence.space-key=${CONFLUENCE_SPACE_KEY:DEMO}

# ── Microsoft Graph → WireMock ────────────────────────────────
microsoft.auth-base-url=${MICROSOFT_AUTH_BASE_URL:http://localhost:8089}
microsoft.graph-base-url=${MICROSOFT_GRAPH_BASE_URL:http://localhost:8089/v1.0}
microsoft.tenant-id=${MICROSOFT_TENANT_ID:demo-tenant}
microsoft.client-id=${MICROSOFT_CLIENT_ID:demo-client}
microsoft.client-secret=${MICROSOFT_CLIENT_SECRET:demo-secret}
microsoft.teams.team-id=demo-team
microsoft.teams.channel-id=demo-channel
microsoft.outlook.user-id=demo-user

# ── Datadog (not used in demo mode) ───────────────────────────
datadog.api-key=${DATADOG_API_KEY:placeholder}
datadog.app-key=${DATADOG_APP_KEY:placeholder}
datadog.site=datadoghq.com
datadog.query=status:error
datadog.poll-interval-ms=3600000
datadog.polling.enabled=false
